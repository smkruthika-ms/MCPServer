swagger: '2.0'
info:
  title: MCP Server
  description: MCP Server able to search for products in dataverse and able to provide details like price, productnumber and so on.
  version: '1.0'
host: localhost:3001
basePath: /
schemes:
  - https
definitions:
  QueryResponse:
    type: object
    properties:
      jsonrpc:
        type: string
      id:
        type: string
      method:
        type: string
      params:
        type: object
      result:
        type: object
      error:
        type: object
paths:
  /sse:
    get:
      summary: MCP Server
      parameters:
        - in: query
          name: sessionId
          type: string
          required: false
      produces:
        - application/json
      responses:
        '200':
          description: Immediate Response
          schema:
            $ref: '#/definitions/QueryResponse'
        '201':
          description: Created and will follow callback
      operationId: ProductSearchMCP
      tags:
        - Agentic
        - McpSse
securityDefinitions: {}
security: []