swagger: '2.0'
info:
  title: MCP Server
  description: MCP Server able to search for products in dataverse.
  version: '1.0'
host: mcpservernet.azurewebsites.net
basePath: /
schemes:
  - https
definitions:
  QueryResponse:
    type: object
    properties:
      jsonrpc:
        type: string
      id:
        type: string
      method:
        type: string
      params:
        type: object
      result:
        type: object
      error:
        type: object
paths:
  /http:
    get:
      summary: MCP Server able to search for products in dataverse.
      parameters:
        - in: query
          name: sessionId
          type: string
          required: false
      produces:
        - application/json
      responses:
        '200':
          description: Immediate Response
          schema:
            $ref: '#/definitions/QueryResponse'
        '201':
          description: Created and will follow callback
      operationId: ProductSearchMCP
      tags:
        - Agentic
        - McpSse
  /stream-products:
    get:
      summary: Stream products as NDJSON (newline-delimited JSON)
      parameters:
        - in: query
          name: productName
          type: string
          required: true
        - in: query
          name: region
          type: string
          required: false
      produces:
        - application/x-ndjson
      responses:
        '200':
          description: Stream of products (NDJSON)
          schema:
            type: string
      operationId: StreamProductsNDJSON
      tags:
        - Agentic
        - McpStream
    post:
      summary: Stream products as NDJSON (newline-delimited JSON) via POST
      consumes:
        - application/json
      produces:
        - application/x-ndjson
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              productName:
                type: string
              region:
                type: string
      responses:
        '200':
          description: Stream of products (NDJSON)
          schema:
            type: string
      operationId: StreamProductsNDJSONPost
      tags:
        - Agentic
        - McpStream
securityDefinitions: {}
security: []